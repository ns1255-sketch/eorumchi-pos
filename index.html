<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>어름치카페 POS</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f7f3ea;color:#222}
header{height:58px;background:#fff;border-bottom:1px solid #ddd;padding:12px 18px;font-size:25px;font-weight:800}
header small{font-size:13px;font-weight:500;margin-left:8px}
main{display:grid;grid-template-columns:minmax(0,1fr) 255px;gap:12px;padding:14px;height:calc(100vh - 58px)}
h2{margin:4px 0 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.item{min-height:82px;border:2px solid #d8ccc1;border-radius:17px;background:#fff;color:#0875a9;font-weight:800;font-size:15px;padding:8px 3px}
.item span{display:block;margin-top:5px;font-size:14px}.side{background:#fff;border-radius:22px;padding:14px;display:flex;flex-direction:column;min-width:0}
.side h2{font-size:27px}.orders{flex:1;overflow:auto;border-top:1px solid #eee;border-bottom:1px solid #eee}
.row{padding:11px 2px;border-bottom:1px solid #eee;font-size:15px;cursor:pointer}.row b{float:right}.decaf{margin-top:10px;padding:13px 5px;border:2px solid #d7c9aa;border-radius:16px;background:#fff7df;color:#0875a9;font-weight:800;font-size:15px}
.total{text-align:right;font-size:30px;font-weight:900;padding:10px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{border:0;border-radius:15px;padding:16px 4px;font-size:18px;font-weight:900}
.card{background:#bcd5f5}.cash{background:#c9e7c9}.cancel{background:#ddd}.sales{background:#f4c3c7}
.note{font-size:12px;color:#777;margin-top:8px}
@media(max-width:650px){main{grid-template-columns:minmax(0,1fr) 32%;gap:6px;padding:8px}.grid{gap:5px}.item{min-height:80px;font-size:14px;padding:6px 2px}.side{padding:8px;border-radius:18px}.side h2{font-size:22px}.actions button{font-size:15px;padding:14px 2px}.total{font-size:26px}header{font-size:22px}}
</style>
</head>
<body>
<header>어름치카페 POS <small>iPad Air 2 호환판</small></header>
<main>
<section>
<h2>음료 · 빵</h2>
<div class="grid" id="menu"></div>
<div class="note">※ 주문내역 항목을 누르면 1개씩 취소됩니다. 커피 주문 후 디카페인 +500원을 추가할 수 있습니다.</div>
</section>
<aside class="side">
<h2>주문내역</h2>
<div class="orders" id="orders"></div>
<button class="decaf" onclick="addItem('디카페인',500)">디카페인 +500원</button>
<div class="total" id="total">0원</div>
<div class="actions">
<button class="card" onclick="pay('카드')">카드 결제</button>
<button class="cash" onclick="pay('현금')">현금 결제</button>
<button class="cancel" onclick="clearOrder()">전체 취소</button>
<button class="sales" onclick="showSales()">오늘 매출</button>
</div>
</aside>
</main>
<script>
const items=[
['아메리카노',3500],['카페라떼',4500],['바닐라라떼',4500],['카페모카',4500],
['초코라떼',4500],['흑임자라떼',4500],['미숫가루',4500],['딸기라떼',4500],
['망고라떼',4500],['스무디',4500],['에이드',4500],['병음료',4500],
['유자차',4500],['자몽차',4500],['레몬차',4500],['캐모마일(유기농)',3500],
['루이보스(유기농)',3500],['빵',3000]
];
let order=[], sales=Number(localStorage.getItem('eorumchiSales')||0);
const menu=document.getElementById('menu'), orders=document.getElementById('orders'), total=document.getElementById('total');
items.forEach(([n,p])=>{let b=document.createElement('button');b.className='item';b.innerHTML=n+'<span>'+p.toLocaleString()+'원</span>';b.onclick=()=>addItem(n,p);menu.appendChild(b)});
function beep(freq=660,dur=.08){
 try{let A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.connect(g);g.connect(c.destination);g.gain.value=.12;o.start();o.stop(c.currentTime+dur)}catch(e){}
}
function addItem(n,p){
 let x=order.find(v=>v.n===n);
 if(x) x.qty++; else order.push({n,p,qty:1});
 beep(660,.08); render()
}
function removeItem(i){
 if(order[i].qty>1) order[i].qty--; else order.splice(i,1);
 beep(440,.06); render()
}
function render(){
 orders.innerHTML=''; let sum=0;
 order.forEach((x,i)=>{sum+=x.p*x.qty;let d=document.createElement('div');d.className='row';d.innerHTML=x.n+' × '+x.qty+' <b>'+(x.p*x.qty).toLocaleString()+'원</b>';d.onclick=()=>removeItem(i);orders.appendChild(d)});
 total.textContent=sum.toLocaleString()+'원';
}
function clearOrder(){order=[];beep(350,.1);render()}
function pay(type){
 let sum=order.reduce((a,x)=>a+x.p*x.qty,0); if(!sum){alert('주문내역이 없습니다.');return}
 sales+=sum;localStorage.setItem('eorumchiSales',sales);beep(880,.18);alert(type+' 결제 완료\\n'+sum.toLocaleString()+'원');order=[];render()
}
function showSales(){alert('오늘 매출\\n'+sales.toLocaleString()+'원')}
render();
</script>
</body></html>
